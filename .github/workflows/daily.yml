name: Revue Quotidienne en Arabe

on:
  schedule:
    # Tous les matins à 07:00 UTC (soit 09:00 heure de Paris l'été, 08:00 l'hiver)
    - cron: '0 7 * * *'
  workflow_dispatch: # Bouton pour tester manuellement à tout moment

jobs:
  update-press:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Configurer Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Installer les dépendances
        run: |
          pip install -r requirements.txt

      - name: Générer la nouvelle revue et l'audio
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python generate.py

      - name: Enregistrer et publier la mise à jour
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html audio/
          git commit -m "Mise à jour quotidienne de la revue de presse arabe" || echo "Aucun changement"
          git push
